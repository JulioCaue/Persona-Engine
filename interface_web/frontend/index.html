<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title>Interface Persona</title>
        <link rel="stylesheet" href="/static/style.css">
        <script src="/static/script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Interface Web Para Projeto Persona</h1>
            <div class="status-container">
                <span class="status-dot"></span>
                <span>Status IA</span>
            </div>
            <div class="status-container">
                <span class="status-dot"></span>
                <span>Arduino</span>
            </div>
        </header>
        <main>
            <controle>
                <h2>Controle</h2>
                <section>
                    <label for="modo_audio">Audio:</label>
                    <select id="modo_audio">
                        <option value=>Selecione...</option>
                        <option value="1">Falar</option>
                        <option value="2">Não Falar</option>
                    </select>
                </section>
                <section>
                    <label for="modoComportamento">Modo de operação:</label>
                    <select id="modoComportamento">
                        <option value=>Selecione...</option>
                        <option value="1">Imitar Fala</option>
                        <option value="2">Conversa por Microfone</option>
                        <option value="3">Conversa por Texto</option>
                    </select>
                </section>
        
                <section class="esconder" id="section_input_mensagem">
                    <label for="mensagem_usuario">Enviar mensagem: </label>
                    <input type="text" id="campo_input" name="mensagem_usuario">
                </section>

                <section>
                    <button id="botao_parar">parar</button>
                </section>
            </controle>
        </main>
    </body>
</html>
